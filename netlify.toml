[build]
command = "NITRO_PRESET=netlify NODE_ENV=production pnpm build"
publish = "dist"
functions = ".netlify/functions-internal"

[build.environment]
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
AGENT_ENGINE = "anthropic"
AGENT_MODEL = "claude-sonnet-5-5"
# Synchronous functions stop at ~10 s, so long holds return early and the
# caller simply asks again.
CHAUPAL_MAX_WAIT_MS = "8000"
